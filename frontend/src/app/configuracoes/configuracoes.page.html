<ion-content class="ion-padding" fullscreen>
  <ion-card class="profile-card">

    <ion-card-header>
      <ion-card-title>{{actualUser?.nome}} {{actualUser?.sobrenome}}</ion-card-title>
      <ion-card-subtitle>{{actualUser?.email}}</ion-card-subtitle>
    </ion-card-header>
    <ion-button expand="block" (click)="openModal()">
      Editar Perfil
    </ion-button>
  </ion-card>

  <ion-list>
    <ion-list-header>Configurações gerais</ion-list-header>

    <ion-item>
      <ion-icon name="sunny-outline" slot="start"></ion-icon>
      <ion-label>Tema do aplicativo</ion-label>
    </ion-item>

    <ion-item>
      <ion-icon name="notifications-outline" slot="start"></ion-icon>
      <ion-label>Notificações</ion-label>
    </ion-item>

    <ion-item button >
      <ion-icon name="accessibility-outline" slot="start"></ion-icon>
      <ion-label>Acessibilidade</ion-label>
    </ion-item>

    <ion-item>
      <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
      <ion-label>Privacidade e Segurança</ion-label>
    </ion-item>

    <ion-list-header>Ajuda</ion-list-header>

    <ion-item>
      <ion-icon name="help-circle-outline" slot="start"></ion-icon>
      <ion-label>Central de ajuda</ion-label>
    </ion-item>

    <ion-item>
      <ion-icon name="information-circle-outline" slot="start"></ion-icon>
      <ion-label>Sobre</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
