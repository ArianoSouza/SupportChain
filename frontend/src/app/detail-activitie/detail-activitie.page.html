<ion-content fullscreen>

  <img [src]="image" alt="imageContent" class="bg-image" (error)="onImgError($event)">
  <div class="container">
    <ion-card>
      <ion-card-content>
        <p>{{desc}}</p>
      </ion-card-content>
    </ion-card>

    <ion-button class="back" (click)="backToActivities()">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </ion-button>

    <div *ngFor="let activity of activities">
      <ion-item button (click)="goToActivitieDetail(activity.id)">
        <ion-icon [name]="activity.icon" slot="start"></ion-icon>
        <ion-label>
          <h2>{{ activity.title }}</h2>
          <p>{{ activity.description }}</p>
        </ion-label>
      </ion-item>
    </div>
  </div>
</ion-content>
