<ion-content #content>

<div class="login-container">
  <img src="assets/images/logo.png" alt="SuportChain Logo" class="logo">
    <ion-input type="email" label="Email" labelPlacement="floating" fill="solid" [(ngModel)]="email" [style]="errorEmail ? '--color:red; --border-color: red;':''" (click)="errorMensageSwitch($event)"></ion-input>
    <ion-label [style]="errorEmail ? '': 'visibility:collapse'">
      <ion-icon name="alert-circle-outline"></ion-icon>
      {{errorMensageEmail}}
    </ion-label>
    <ion-input type="password" label="Senha" labelPlacement="floating" fill="solid" [(ngModel)]="senha" [style]="errorPassword ? '--color:red; --border-color: red':''" (click)="errorMensageSwitch($event)">
      <ion-input-password-toggle slot="end"></ion-input-password-toggle>
    </ion-input>
    <ion-label [style]="errorPassword ? '': 'visibility:collapse'">
      <ion-icon name="alert-circle-outline"></ion-icon>
      {{errorMensagePassword}}
    </ion-label>
  <ion-button expand="block" class="login-button" (click)="onLogin()" id="open-toast">Entrar</ion-button>
  <div class="register-link">
    <p>Não possui cadastro? <i button (click)="goToCadastro()">Criar conta</i></p>
  </div>
  <div class="footer">
    <p>by</p>
    <img src="/assets/images/logoNoilusions.png" alt="">
  </div>
</div>
<ion-toast trigger="open-toast" [message]="!errorEmail && !errorPassword ? 'Login realizado com sucesso!':'Erro ao realizar Login'"  position="top" [duration]="1000" [icon]="!errorEmail && !errorPassword? 'checkbox' :'warning'"></ion-toast>
</ion-content>
