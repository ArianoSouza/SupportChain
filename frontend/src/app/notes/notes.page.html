<ion-content class="ion-padding" fullscreen="true">

  <!-- Sugestões -->
  <ion-text class="sugestoes-titulo">Sugestões</ion-text>

  <ion-grid class="sugestoes-grid">
    <ion-row class="ion-justify-content-around">
      <ion-col size="3" class="sugestao-item">
        <ion-icon name="create-outline" class="icone" button id="open-new-note"></ion-icon>
        <ion-label>Nova nota</ion-label>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Nota do diário -->
   <ion-list>
    <ion-card class="caixa-nota" *ngFor="let note of sortByDateAllNotes">
      <ng-container *ngIf="note.title else noTitle">
        <h2>{{note.title}}</h2>
      </ng-container>
      <ng-template #noTitle>
      </ng-template>
      <ion-text class="titulo-nota">{{note.noteType}}</ion-text>
      <p class="texto-nota">{{note.content}}</p>
      <ion-text class="data-nota">{{formatIsoDateToEn(note.noteDate)}}</ion-text>
    </ion-card>
   </ion-list>
  
</ion-content>

<ion-modal trigger="open-new-note" #newNote>
  <ng-template>
    <app-new-note/>
  </ng-template>
</ion-modal>
