<ion-content>
  <h3>Nesse modulo:</h3>
  <ion-list>
    <h4 *ngFor="let title of content?.titles">
    -> {{title}}
    </h4>
  </ion-list>
  <ion-list>
    <p *ngFor="let paragraph of content?.paragraphs">
      {{paragraph}}
    </p>
  </ion-list>
 
  <ion-button (click)="closeModal()">
    <ion-icon name="chevron-back"></ion-icon>
  </ion-button>
  

</ion-content>
