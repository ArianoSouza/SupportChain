
<ion-content class="ion-padding">
  <form [formGroup]="perfilForm" (ngSubmit)="salvar()">
    <ion-item>
      <ion-label position="floating">Nome</ion-label>
      <ion-input formControlName="nome"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Email</ion-label>
      <ion-input type="email" formControlName="email"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Telefone</ion-label>
      <ion-input type="tel" formControlName="telefone"></ion-input>
    </ion-item>

    <ion-button expand="block" type="submit" [disabled]="perfilForm.invalid">Salvar</ion-button>
  </form>
</ion-content>
