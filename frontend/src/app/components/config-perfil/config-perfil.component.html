
<ion-content class="ion-padding">
  <form (ngSubmit)="salvar()">
    <h3>Editar informações</h3>
      <ion-input [(ngModel)]="user.nome"  name="nome" label="Nome" labelPlacement="floating" fill="solid" ></ion-input>

      <ion-input [(ngModel)]="user.sobrenome"  name="sobrenome" label="Sobrenome"labelPlacement="floating" fill="solid" ></ion-input>

      <ion-input type="email" [(ngModel)]="user.email" name="email" label="Email" labelPlacement="floating" fill="solid"></ion-input>

    <ion-button expand="block" (click)="salvar()">Salvar</ion-button>
  </form>
  <ion-button class="exit-button" (click)="closemodal()">
    <ion-icon name="arrow-back-outline"></ion-icon>
  </ion-button>
</ion-content>
