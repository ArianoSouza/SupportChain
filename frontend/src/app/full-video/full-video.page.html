


  <video id="videoPlayer" [src]="video?.URL" autoplay loop (click)="toggleVideo()"></video>
<ion-button class="exit-button" (click)="backToVideos()">
  <ion-icon name="arrow-back-outline"></ion-icon>
</ion-button>
<div class="container-likes" [style]="showAll == false ? 'transform:translateY(110px)':'transform:translateY(0)'">
  <p>{{video?.likesNumber}}</p>
  <ion-icon button name="heart" class="like-button" (click)="onLikeVideo(videoId)"></ion-icon>
</div>
<div class="info" [style]="showAll == false ? 'transform:translateY(110px)':'transform:translateY(0)'" button (click)="toggleShowAll()">
  <h3>{{video?.title}}</h3>
  <p>{{video?.description}}</p>
  <ion-chip *ngFor="let tag of video?.tags">{{tag}}</ion-chip>
</div>
